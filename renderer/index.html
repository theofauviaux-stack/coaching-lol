<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://ddragon.leagueoflegends.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Coaching LoL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">⚔️ <span>COACHING</span><small>League of Legends</small></div>
    <nav>
      <button data-page="joueurs" class="nav">👥 Joueurs</button>
      <button data-page="dashboard" class="nav">📊 Tableau de bord</button>
      <button data-page="parties" class="nav">🎮 Parties</button>
      <button data-page="sessions" class="nav">📝 Sessions</button>
      <button data-page="parametres" class="nav">⚙️ Paramètres</button>
    </nav>
    <div class="side-foot">
      <button id="btn-sync" class="btn gold wide">🔄 Synchroniser</button>
      <div id="sync-status" class="muted small"></div>
      <div id="app-version" class="muted tiny"></div>
    </div>
  </aside>
  <main>
    <div id="update-banner" class="banner hidden"></div>
    <div id="page"></div>
  </main>
  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="stats.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
