name: Publier une version

# Pour publier une mise à jour : changer "version" dans package.json (ex. 1.0.1) et l'envoyer sur main.
# GitHub crée la release v<version> en brouillon, compile Mac + Windows, y dépose les installateurs,
# puis la publie seulement quand tout est prêt : les applications installées ne voient jamais
# une version à moitié publiée (sans ses fichiers de mise à jour).
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      plateforme:
        description: 'Plateforme à (re)compiler'
        type: choice
        options: [mac, windows, les deux]
        default: les deux

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rel.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        name: Créer la release si cette version n'existe pas encore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à faire."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "Coaching LoL $VERSION" --notes "Version $VERSION. Windows : Coaching-LoL-Setup-$VERSION.exe · Mac : le fichier .dmg"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: release
    if: needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.plateforme == 'mac' && '["macos-15-intel"]' || github.event.inputs.plateforme == 'windows' && '["windows-latest"]' || '["macos-15-intel","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Compiler et déposer dans la release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # brouillon tant que la compilation n'est pas finie (une release déjà publiée reste publiée)
          EP_DRAFT: ${{ needs.release.outputs.created == 'true' && 'true' || '' }}

  publish:
    needs: [release, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publier la release quand Mac et Windows sont prêts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "v$VERSION" --draft=false --latest
            echo "Release v$VERSION publiée."
          else
            echo "Release v$VERSION déjà publiée."
          fi
